version: 2
models:
  - name: fct_weather_hourly
    columns:
      - name: weather_key
        tests: [not_null, unique]
      - name: city
        tests:
          - not_null
          - accepted_values:
              values: ['Jakarta','Makassar','Surabaya','Bandung','Denpasar','Yogyakarta']
      - name: relative_humidity_pct
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 100}
  - name: fct_weather_daily
    columns:
      - name: weather_date
        tests: [not_null]